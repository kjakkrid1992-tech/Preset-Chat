<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Preset ตอบแชท</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Light Theme Colors */
        :root {
            --bg: #F0F4F8; --text: #212529; --muted: #6C757D; --card: #FFFFFF; --line: #DEE2E6; --accent: #1976D2; --accent-2: #1565C0; --shadow: 0 4px 12px rgba(0,0,0,0.08);
        }
        /* Dark Theme Colors */
        [data-theme='dark'] {
            --bg: #121212; --text: #E0E0E0; --muted: #BDBDBD; --card: #1E1E1E; --line: #333333; --accent: #64B5F6; --accent-2: #42A5F5; --shadow: 0 4px 12px rgba(0,0,0,0.3);
        }
        body { font-family: 'IBM Plex Sans Thai', sans-serif; transition: background .2s, color .2s; }
        .bg-page { background: var(--bg); }
        .text-main { color: var(--text); }
        .bg-card { background: var(--card); }
        .border-line { border-color: var(--line); }
        .shadow-main { box-shadow: var(--shadow); }
        .text-muted { color: var(--muted); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-primary:hover { background: var(--accent-2); }
        .btn-outline { border: 1px solid var(--line); color: var(--text); }
        .badge-house { background: #E3F2FD; color: #1565C0; }
        .badge-inn { background: #E8F5E9; color: #388E3C; }
        .dot-house { background: #1976D2; }
        .dot-inn { background: #4CAF50; }
        .sort-icon { display: none; }
        .sortable[data-sort-dir="asc"] .sort-asc-icon { display: inline-block; }
        .sortable[data-sort-dir="desc"] .sort-desc-icon { display: inline-block; }
        .modal { z-index: 999; }
        .modal-overlay { background-color: rgba(0,0,0,0.4); }
        .seg { display:inline-flex; border:1px solid var(--line); background:var(--card); border-radius:999px; overflow:hidden; box-shadow:var(--shadow); }
        .seg button { padding:8px 12px; border:0; background:transparent; color:var(--muted); cursor:pointer; min-height:44px; font-size:14px; }
        .seg button[aria-pressed="true"] { background:var(--accent); color:#fff; }
        .toast { position: fixed; right: 12px; bottom: 12px; z-index: 1000; padding: 10px 16px; border-radius: 999px; background: #333; color: #fff; opacity: 0; transform: translateY(20px); transition: opacity 0.3s, transform 0.3s; }
        .toast.show { opacity: 1; transform: translateY(0); }
        .table-auto { border-spacing: 0; }
        .table-auto th, .table-auto td { padding: 12px 16px; }
        input, select, textarea { background-color: var(--bg); color: var(--text); border-color: var(--line); }
        /* Drag and Drop Styles */
        .dragging { opacity: 0.5; background: var(--accent-2); }
        .drag-over { border-top: 2px solid var(--accent); }
        /* Generator Card Styles */
        .generated-text .highlight {
            color: var(--accent);
            font-weight: 600;
            background-color: #e3f2fd;
            padding: 2px 4px;
            border-radius: 4px;
        }
        [data-theme='dark'] .generated-text .highlight {
            background-color: rgba(100, 181, 246, 0.2);
        }
        /* Mobile Expandable Row Styles */
        .expandable-content {
            max-height: 0;
            overflow-y: hidden;
            transition: max-height 0.3s ease-in-out;
        }
        tr.is-expanded .expandable-content {
            max-height: 200px;
            overflow-y: auto;
        }
        .expand-icon {
            transition: transform 0.3s ease-in-out;
        }
        tr.is-expanded .expand-icon {
            transform: rotate(180deg);
        }
    </style>
</head>
<body class="bg-page text-main" data-theme="light">
    <div class="container mx-auto p-4 sm:p-6 lg:p-8">
        <!-- Header -->
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6">
            <h1 class="text-3xl font-bold mb-4 md:mb-0">แดชบอร์ดจัดการข้อความ</h1>
            <div class="w-full md:w-auto flex flex-wrap items-center justify-start md:justify-end gap-2">
                <div class="seg" role="group" aria-label="ภาษา" id="lang-seg">
                    <button id="lang-th" aria-pressed="true">TH</button>
                    <button id="lang-en" aria-pressed="false">EN</button>
                </div>
                <div class="seg" role="group" aria-label="สรรพนาม" id="tone-seg">
                    <button id="tone-ka" aria-pressed="false">ค่ะ/นะคะ</button>
                    <button id="tone-krub" aria-pressed="true">ครับ/นะครับ</button>
                </div>
                <button id="theme-toggle" class="bg-card text-main rounded-full w-10 h-10 flex items-center justify-center shadow-main hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors duration-200">🌙</button>
                <button id="create-new-btn" class="btn-primary py-2 px-4 rounded-full shadow-main hover:scale-105 transition-transform duration-200">
                    <i class="fas fa-plus mr-2"></i> สร้างข้อความใหม่
                </button>
            </div>
        </div>
        
        <!-- Responsive Confirmation Generator Card -->
        <div id="confirmation-generator" class="bg-card rounded-2xl shadow-main border border-line p-4 mb-6">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
                <div class="flex-grow">
                    <h2 id="generator-title" class="text-lg font-bold">สร้างข้อความยืนยันการจอง</h2>
                    <p id="generator-desc" class="text-sm text-muted">กรอกวันที่เพื่อสร้างข้อความ</p>
                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-3 mt-3">
                        <label>
                            <span id="generator-checkin-label" class="text-xs text-muted">เช็คอิน</span>
                            <input type="date" class="ci-date text-sm p-2 rounded-lg border border-line w-full">
                        </label>
                        <label>
                            <span id="generator-nights-label" class="text-xs text-muted">คืน</span>
                            <input type="number" class="nights-count text-sm p-2 rounded-lg border border-line w-full" value="1" min="1">
                        </label>
                        <label class="col-span-2 sm:col-span-1">
                            <span id="generator-checkout-label" class="text-xs text-muted">เช็คเอาต์</span>
                            <input type="date" class="co-date text-sm p-2 rounded-lg border border-line w-full">
                        </label>
                    </div>
                </div>
                <div class="sm:w-2/5 flex flex-col flex-shrink-0">
                    <div id="first-generated-text" class="generated-text w-full text-xs p-2 rounded-lg bg-page whitespace-pre-wrap min-h-[70px]">...</div>
                    <button id="copy-generated-btn" class="btn-primary w-full mt-2 py-2 px-3 rounded-lg text-sm">
                        <i class="fas fa-copy mr-1"></i><span id="generator-copy-btn-text">คัดลอก</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- NEW: Final Slip Generator Card -->
        <div id="final-slip-generator" class="bg-card rounded-2xl shadow-main border border-line p-4 mb-6">
            <div class="flex flex-col sm:flex-row sm:items-start sm:justify-between gap-4">
                <div class="flex-grow">
                    <h2 id="slip-title" class="text-lg font-bold text-accent">ออกสลิปยืนยันการจอง (Final Slip)</h2>
                    <p id="slip-desc" class="text-sm text-muted">กรอกข้อมูลลูกค้าและยอดเงินเพื่อสร้างข้อความแบบฟอร์ม</p>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-3">
                        <label class="col-span-2 sm:col-span-2">
                            <span id="slip-prop-label" class="text-xs text-muted">ที่พัก</span>
                            <select id="slip-prop" class="text-sm p-2 rounded-lg border border-line w-full focus:ring-2 focus:ring-accent-2 focus:outline-none">
                                <option value="BJ">บ้านเจอกัน (BJ)</option>
                                <option value="L1F">ลอสอินน์นคร ชั้น 1 (L1F)</option>
                                <option value="L2F">ลอสอินน์นคร ชั้น 2 (L2F)</option>
                                <option value="L3F">ลอสอินน์นคร ชั้น 3 (L3F)</option>
                            </select>
                        </label>
                        <label class="col-span-2 sm:col-span-2">
                            <span id="slip-channel-label" class="text-xs text-muted">ช่องทางการจอง</span>
                            <select id="slip-channel" class="text-sm p-2 rounded-lg border border-line w-full focus:ring-2 focus:ring-accent-2 focus:outline-none">
                                <option value="LN">LINE (LN)</option>
                                <option value="FB">FACEBOOK (FB)</option>
                            </select>
                        </label>
                        <label class="col-span-2 sm:col-span-2">
                            <span id="slip-name-label" class="text-xs text-muted">ชื่อผู้จอง</span>
                            <input type="text" id="slip-name" class="text-sm p-2 rounded-lg border border-line w-full focus:ring-2 focus:ring-accent-2 focus:outline-none" placeholder="เช่น คุณสมชาย">
                        </label>
                        <label class="col-span-2 sm:col-span-2">
                            <span id="slip-phone-label" class="text-xs text-muted">เบอร์โทรติดต่อ</span>
                            <input type="text" id="slip-phone" class="text-sm p-2 rounded-lg border border-line w-full focus:ring-2 focus:ring-accent-2 focus:outline-none" placeholder="เช่น 0812345678">
                        </label>
                        <label class="col-span-2 sm:col-span-1">
                            <span id="slip-deposit-label" class="text-xs text-muted">ยอดมัดจำ (บาท)</span>
                            <input type="text" id="slip-deposit" class="text-sm p-2 rounded-lg border border-line w-full focus:ring-2 focus:ring-accent-2 focus:outline-none" placeholder="1000">
                        </label>
                        <label class="col-span-2 sm:col-span-1">
                            <span id="slip-total-label" class="text-xs text-muted">ยอดรวม (บาท)</span>
                            <input type="text" id="slip-total" class="text-sm p-2 rounded-lg border border-line w-full focus:ring-2 focus:ring-accent-2 focus:outline-none" placeholder="2500">
                        </label>
                    </div>
                </div>
                <div class="sm:w-2/5 flex flex-col flex-shrink-0">
                    <div id="slip-generated-text" class="generated-text w-full text-xs sm:text-sm p-3 rounded-lg bg-page whitespace-pre-wrap min-h-[120px]">...</div>
                    <button id="copy-slip-btn" class="btn-primary w-full mt-2 py-2 px-3 rounded-lg text-sm">
                        <i class="fas fa-copy mr-1"></i><span>คัดลอกสลิปยืนยัน</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Preset Management Table -->
        <div class="bg-card rounded-2xl shadow-main border border-line p-4 md:p-6 overflow-x-auto">
            <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-4">
                <div class="relative w-full sm:w-auto">
                    <input type="text" id="search-input" placeholder="ค้นหาข้อความ..." class="w-full pl-10 pr-4 py-2 rounded-full text-main border border-line focus:outline-none focus:ring-2 focus:ring-accent-2">
                    <i class="fas fa-search absolute left-3 top-1/2 -translate-y-1/2 text-muted"></i>
                </div>
                <div class="flex-grow"></div>
                <div class="flex items-center gap-2 w-full sm:w-auto">
                    <label for="filter-select" class="text-muted whitespace-nowrap hidden md:block">ตัวกรอง:</label>
                    <select id="filter-select" class="w-full sm:w-auto py-2 px-4 rounded-full text-main border border-line focus:outline-none focus:ring-2 focus:ring-accent-2">
                        <option value="all">ทั้งหมด</option>
                        <option value="house">บ้านเจอกัน</option>
                        <option value="inn">ลอสอินน์นคร</option>
                    </select>
                </div>
            </div>
            <table class="w-full table-auto">
                <thead>
                    <tr class="text-left text-sm font-medium text-muted border-b border-line">
                        <th class="py-3 px-2 cursor-pointer sortable" data-sort-by="title">
                            ชื่อข้อความ
                            <i class="fas fa-caret-up sort-icon sort-asc-icon"></i>
                            <i class="fas fa-caret-down sort-icon sort-desc-icon"></i>
                        </th>
                        <th class="py-3 px-2 hidden md:table-cell cursor-pointer sortable" data-sort-by="prop" style="min-width: 150px;">
                            ประเภท
                            <i class="fas fa-caret-up sort-icon sort-asc-icon"></i>
                            <i class="fas fa-caret-down sort-icon sort-desc-icon"></i>
                        </th>
                        <th class="py-3 px-2 hidden lg:table-cell" data-key="colExample">ข้อความตัวอย่าง</th>
                        <th class="py-3 px-2 text-right" data-key="colActions">การจัดการ</th>
                        <th class="py-3 px-2 w-8"></th> <!-- Column for drag handle -->
                    </tr>
                </thead>
                <tbody id="presets-table-body" class="divide-y divide-line">
                    <!-- Presets will be rendered here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Universal Add/Edit Modal -->
    <div id="preset-modal" class="modal fixed inset-0 hidden items-center justify-center p-4 modal-overlay transition-opacity duration-200 opacity-0">
        <div class="bg-card rounded-2xl shadow-lg border border-line p-6 w-full max-w-2xl transform scale-95 transition-transform duration-200">
            <h3 id="preset-modal-title" class="text-xl font-bold mb-4"></h3>
            <div class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="preset-title-th" class="block text-sm font-medium text-muted mb-1">ชื่อข้อความ (TH)</label>
                        <input type="text" id="preset-title-th" class="w-full p-2 rounded-lg border border-line focus:outline-none focus:ring-2 focus:ring-accent-2" required>
                    </div>
                    <div>
                        <label for="preset-title-en" class="block text-sm font-medium text-muted mb-1">ชื่อข้อความ (EN)</label>
                        <input type="text" id="preset-title-en" class="w-full p-2 rounded-lg border border-line focus:outline-none focus:ring-2 focus:ring-accent-2">
                    </div>
                </div>
                <div>
                    <label for="preset-prop" class="block text-sm font-medium text-muted mb-1">ประเภท</label>
                    <select id="preset-prop" class="w-full p-2 rounded-lg border border-line focus:outline-none focus:ring-2 focus:ring-accent-2">
                        <option value="all">ทั้งหมด</option>
                        <option value="house">บ้านเจอกัน</option>
                        <option value="inn">ลอสอินน์นคร</option>
                    </select>
                </div>
                <div>
                    <label for="preset-content-th" class="block text-sm font-medium text-muted mb-1">เนื้อหา (TH)</label>
                    <textarea id="preset-content-th" rows="4" class="w-full p-2 rounded-lg border border-line resize-y focus:outline-none focus:ring-2 focus:ring-accent-2"></textarea>
                </div>
                <div>
                    <label for="preset-content-en" class="flex items-center text-sm font-medium text-muted mb-1">
                        <span>เนื้อหา (EN)</span>
                        <button type="button" id="auto-translate-btn" class="ml-2 text-accent text-xs font-bold hover:underline">✨ แปลอัตโนมัติ</button>
                    </label>
                    <textarea id="preset-content-en" rows="4" class="w-full p-2 rounded-lg border border-line resize-y focus:outline-none focus:ring-2 focus:ring-accent-2"></textarea>
                </div>
            </div>
            <div class="flex justify-end mt-6 gap-2">
                <button id="preset-modal-cancel" class="btn-outline text-main py-2 px-4 rounded-full">ยกเลิก</button>
                <button id="preset-modal-save" class="btn-primary py-2 px-4 rounded-full">บันทึก</button>
            </div>
        </div>
    </div>

    <!-- Custom Confirmation Modal -->
    <div id="confirm-modal" class="modal fixed inset-0 hidden items-center justify-center p-4 modal-overlay transition-opacity duration-200 opacity-0">
        <div class="bg-card rounded-2xl shadow-lg border border-line p-6 w-full max-w-sm transform scale-95 transition-transform duration-200">
            <h3 class="text-xl font-bold mb-4">ยืนยันการดำเนินการ</h3>
            <p id="confirm-message" class="text-main mb-6">คุณแน่ใจหรือไม่?</p>
            <div class="flex justify-end gap-2">
                <button id="confirm-cancel" class="btn-outline text-main py-2 px-4 rounded-full">ยกเลิก</button>
                <button id="confirm-ok" class="btn-primary py-2 px-4 rounded-full bg-red-600 hover:bg-red-700">ยืนยัน</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <!-- Firebase SDKs -->

                { id: 'pet', order: 11, titleTH: 'นโยบายสัตว์เลี้ยง', titleEN: 'Pet Policy', prop: 'all', contentTH: 'ทางที่พักขอความร่วมมือ ไม่ให้นำสุนัขเข้าภายในห้องนอน\nเพื่อรักษาความสะอาดและความสะดวกสำหรับลูกค้าท่านถัดไปนะคะ 🙏\n\nในกรณีที่ตรวจพบการฝ่าฝืน ทางที่พักขออนุญาตเรียกเก็บค่าปรับ 1,000 บาท\nเพื่อชดเชยค่าทำความสะอาดและดูแลรักษาที่พักให้พร้อมใช้งานค่ะ\n\nขอบคุณพี่ลูกค้ามาก ๆ ค่ะที่ให้ความร่วมมือค่ะ', contentEN: 'Pet policy: Please keep dogs out of the bedrooms to maintain cleanliness and comfort for the next guests. 🙏\nIf we detect a violation, a 1,000 THB cleaning fee will apply.\nThank you very much for your cooperation.' },

                en: { title: 'Message Management Dashboard', create: 'Create New Message', searchPlaceholder: 'Search messages...', filterLabel: 'Filter:', all: 'All', house: 'Baan Jerkan', inn: 'Los Inn Nakhon', colName: 'Message Name', colType: 'Type', colExample: 'Example Message', colActions: 'Actions', editBtn: 'Edit', copyBtn: 'Copy', deleteBtn: 'Delete', noData: 'No data matching the criteria', editModalTitle: 'Edit Message', addModalTitle: 'Create New Message', editModalSave: 'Save', editModalCancel: 'Cancel', confirmTitle: 'Confirm Action', confirmMessage: 'Are you sure?', confirmOk: 'Confirm', confirmCancel: 'Cancel', copySuccess: 'Copied ✓', deleteConfirm: 'Are you sure you want to delete this message?', createSuccess: 'New message created successfully', confirmGeneratorTitle: 'Generate Booking Confirmation', confirmGeneratorDesc: 'Fill dates to generate message', checkinLabel: 'Check-in', checkoutLabel: 'Check-out', nightsLabel: 'Nights', confirmMsg: (ci, co, n) => `Booking confirmation: Check-in <span class="highlight">${ci}</span> • Check-out <span class="highlight">${co}</span> • <span class="highlight">${n} night(s)</span>\nPlease share the booker’s full name and phone number.` }
            };
            
            let allPresets = [];
            let currentSort = { by: 'order', dir: 'asc' };
            let editingPresetId = null;
            let confirmCallback = null;
            let currentLang = 'th';
            let currentTone = 'krub';
            let draggedItem = null;

            async function seedInitialData() {
                const batch = writeBatch(db);
                DEFAULT_PRESETS_DATA.forEach(preset => {
                    const docRef = doc(db, 'presets', preset.id);
                    batch.set(docRef, preset);
                });
                await batch.commit();
                return DEFAULT_PRESETS_DATA;
            }
            async function loadPresetsFromFirebase() {
                try {
                    const q = query(presetsCollection, orderBy("order"));
                    const querySnapshot = await getDocs(q);
                    if (querySnapshot.empty) {
                        return await seedInitialData();
                    }
                    const presets = [];
                    querySnapshot.forEach((doc) => {
                        presets.push(doc.data());
                    });
                    return presets;
                } catch (e) {
                    console.error("Failed to load presets from Firestore", e);
                    alert("ไม่สามารถเชื่อมต่อฐานข้อมูลได้! โปรดตรวจสอบการตั้งค่า Firebase");
                    return [];
                }
            }
            async function addPresetToFirebase(newPreset) {
                const docRef = doc(db, 'presets', newPreset.id);
                await setDoc(docRef, newPreset);
            }
            async function updatePresetInFirebase(id, data) {
                const docRef = doc(db, 'presets', id);
                await updateDoc(docRef, data);
            }
            async function deletePresetFromFirebase(id) {
                await deleteDoc(doc(db, 'presets', id));
            }
            async function updateOrderInFirebase() {
                const batch = writeBatch(db);
                const rows = Array.from($tableBody.querySelectorAll('tr[draggable="true"]'));
                let changed = false;
                rows.forEach((row, index) => {
                    const docId = row.dataset.id;
                    if (docId) {
                        const preset = allPresets.find(p => p.id === docId);
                        if (preset && preset.order !== undefined && preset.order !== index) {
                            changed = true;
                            const docRef = doc(db, 'presets', docId);
                            batch.update(docRef, { order: index });
                            preset.order = index;
                        }
                    }
                });
                if (changed) {
                    await batch.commit();
                    setToast("บันทึกลำดับใหม่แล้ว", 1500);
                }
            }
            
            function initializeConfirmationGenerator() {
                const card = $('#confirmation-generator');
                const ciInput = card.querySelector('.ci-date');
                const nightsInput = card.querySelector('.nights-count');
                const coInput = card.querySelector('.co-date');
                const generatedTextEl = card.querySelector('#first-generated-text');
                const copyBtn = card.querySelector('#copy-generated-btn');

                const toISO = d => d.toISOString().slice(0,10);

                function updateMessage() {
                    const ci = ciInput.value;
                    const co = coInput.value;
                    const nights = parseInt(nightsInput.value, 10);
                    if (ci && co && nights > 0) {
                        let msg = UI_STRINGS[currentLang].confirmMsg(fmtDDMMYY(ci), fmtDDMMYY(co), nights);
                        msg = applyTone(msg);
                        generatedTextEl.innerHTML = msg;
                    } else {
                        generatedTextEl.textContent = '...';
                    }
                }

                function onCiOrNightsChange() {
                    if (!ciInput.value) return;
                    const checkinDate = new Date(ciInput.value);
                    const numNights = parseInt(nightsInput.value, 10);
                    if (!isNaN(checkinDate.getTime()) && numNights > 0) {
                        const checkoutDate = new Date(checkinDate.getTime());
                        checkoutDate.setDate(checkoutDate.getDate() + numNights);
                        coInput.value = toISO(checkoutDate);
                    }
                    updateMessage();
                    // เพิ่มบรรทัดนี้: เพื่อส่งสัญญาณแจ้งเตือนระบบว่ามีการเปลี่ยนวันที่เรียบร้อยแล้ว
                    document.dispatchEvent(new Event('datesSync'));
                }

                function onCoChange() {
                    if (!ciInput.value || !coInput.value) return;
                    const checkinDate = new Date(ciInput.value);
                    const checkoutDate = new Date(coInput.value);
                    if (!isNaN(checkinDate.getTime()) && !isNaN(checkoutDate.getTime()) && checkoutDate > checkinDate) {
                        const timeDiff = checkoutDate.getTime() - checkinDate.getTime();
                        const nights = Math.ceil(timeDiff / (1000 * 3600 * 24));
                        nightsInput.value = nights > 0 ? nights : 1;
                    }
                    updateMessage();
                    // เพิ่มบรรทัดนี้: เพื่อส่งสัญญาณแจ้งเตือนระบบว่ามีการเปลี่ยนวันที่เรียบร้อยแล้ว
                    document.dispatchEvent(new Event('datesSync'));
                }

                ciInput.addEventListener('change', onCiOrNightsChange);
                nightsInput.addEventListener('input', onCiOrNightsChange);
                coInput.addEventListener('change', onCoChange);
                copyBtn.addEventListener('click', () => {
                    const text = generatedTextEl.innerText; // Use innerText to copy without HTML tags
                    if (text && text !== '...') {
                        copyText(text);
                    }
                });

                ciInput.value = toISO(new Date());
                onCiOrNightsChange();
            }

                    const channel = channelSelect.value;
                    const name = nameInput.value || 'ชื่อลูกค้า';
                    const phone = phoneInput.value || 'เบอร์โทร';
                    
                    const rawDeposit = depositInput.value ? depositInput.value.replace(/,/g, '') : '';
                    const rawTotal = totalInput.value ? totalInput.value.replace(/,/g, '') : '';

                    const deposit = rawDeposit ? Number(rawDeposit).toLocaleString() : 'ยอดมัดจำ';
                    let remain = 'ยอดคงเหลือ';
                    if (rawDeposit && rawTotal) {
                        const r = Number(rawTotal) - Number(rawDeposit);
                        remain = r > 0 ? r.toLocaleString() : '0';
                    }

                    const shortDeposit = rawDeposit || 'ยอดมัดจำ';
                    const shortTotal = rawTotal || 'ยอดรวม';

                    const ci = fmtDDMMYY(ciInput.value) || 'XX/XX/XX';
                    const co = fmtDDMMYY(coInput.value) || 'XX/XX/XX';

                    let fullPropName = '';
                    let fullPropNameEn = '';
                    if (propCode === 'BJ') { fullPropName = 'บ้านเจอกัน'; fullPropNameEn = 'Baan Jerkan'; }
                    else if (propCode === 'L1F') { fullPropName = 'ลอสอินน์นคร ชั้น 1'; fullPropNameEn = 'Los Inn Nakhon Fl. 1'; }
                    else if (propCode === 'L2F') { fullPropName = 'ลอสอินน์นคร ชั้น 2'; fullPropNameEn = 'Los Inn Nakhon Fl. 2'; }
                    else if (propCode === 'L3F') { fullPropName = 'ลอสอินน์นคร ชั้น 3'; fullPropNameEn = 'Los Inn Nakhon Fl. 3'; }

                    const shortFormat = `${propCode}|${channel}|${name}|${phone}|${shortDeposit}/${shortTotal}`;

                    // ใส่ Highlight โดยตรงลงใน Template แทนการใช้ replace() ทีหลัง เพื่อป้องกันบัคทับซ้อนกับตัวเลข
                    const hName = `<span class="highlight">${name}</span>`;
                    const hPhone = `<span class="highlight">${phone}</span>`;
                    const hDeposit = `<span class="highlight">${deposit}</span>`;
                    const hRemain = `<span class="highlight">${remain}</span>`;
                    const hShortFormat = `<span class="highlight">${shortFormat}</span>`;

                    let highlightedMsg = "";
                    if(currentLang === 'th') {
                        highlightedMsg = `[ยืนยันการจองที่พัก - ${fullPropName}]
📍 เช็คอิน: ${ci} (หลัง 14.00 น.)
📍 เช็คเอาท์: ${co} (ก่อน 12.00 น.)
👤 ผู้จอง: ${hName}
📞 เบอร์ติดต่อ: ${hPhone}
💰 สถานะ: มัดจำแล้ว ${hDeposit}.- (ยอดคงเหลือ ${hRemain}.- ชำระวันเข้าพัก)

${hShortFormat}`;
                    } else {
                        highlightedMsg = `[Booking Confirmation - ${fullPropNameEn}]
📍 Check-in: ${ci} (After 14:00)
📍 Check-out: ${co} (Before 12:00)
👤 Booker: ${hName}
📞 Phone: ${hPhone}
💰 Status: Deposit paid ${hDeposit} THB (Remaining ${hRemain} THB to be paid on arrival)

${hShortFormat}`;
                    }
                    
                    generatedEl.innerHTML = highlightedMsg;
                }

                [nameInput, phoneInput, depositInput, totalInput, propSelect, channelSelect].forEach(el => el.addEventListener('input', updateSlip));
                
                // --- ลบ 2 บรรทัดเก่าออก ---
                // ciInput.addEventListener('change', updateSlip);
                // coInput.addEventListener('change', updateSlip);

                copyBtn.addEventListener('click', () => {
                    const textToCopy = generatedEl.innerText;
                    if (textToCopy && textToCopy !== '...') {
                        copyText(textToCopy);
                    }
                });

                // Listen to external change from language toggle
                document.addEventListener('langChanged', updateSlip);
                
                // --- เพิ่มบรรทัดใหม่นี้เข้าไป ---
                // ดักจับสัญญาณ 'datesSync' ที่ส่งมาจากกล่องด้านบน เพื่ออัปเดตสลิป
                document.addEventListener('datesSync', updateSlip);
                
                updateSlip();
            }

            function renderTable() {
                const searchTerm = $searchInput.value.toLowerCase();
                const filterType = $filterSelect.value;
                const lang = currentLang;

                let displayPresets = allPresets.filter(p => {
                    const title = p[`title${lang.toUpperCase()}`] || p.titleTH;
                    const content = p[`content${lang.toUpperCase()}`] || p.contentTH;
                    const matchesSearch = title.toLowerCase().includes(searchTerm) || (content && content.toLowerCase().includes(searchTerm));
                    
                    let finalMatchesFilter = false;
                    if (filterType === 'all') {
                        finalMatchesFilter = true;
                    } else {
                        if (p.prop === filterType || p.prop === 'all') {
                            finalMatchesFilter = true;
                        }
                    }

                    return matchesSearch && finalMatchesFilter;
                });
                
                if (currentSort.by !== 'order') {
                    displayPresets.sort((a, b) => {
                        const aVal = a[currentSort.by === 'title' ? `title${lang.toUpperCase()}` : currentSort.by] || '';
                        const bVal = b[currentSort.by === 'title' ? `title${lang.toUpperCase()}` : currentSort.by] || '';
                        if (currentSort.dir === 'asc') return aVal.localeCompare(bVal, lang, { sensitivity: 'base' });
                        return bVal.localeCompare(aVal, lang, { sensitivity: 'base' });
                    });
                } else {
                    displayPresets.sort((a, b) => a.order - b.order);
                }
                
                $tableBody.innerHTML = displayPresets.map(p => {
                    const badgeClass = p.prop === 'house' ? 'badge-house' : (p.prop === 'inn' ? 'badge-inn' : 'bg-gray-200 text-gray-800');
                    const dotClass = p.prop === 'house' ? 'dot-house' : (p.prop === 'inn' ? 'dot-inn' : 'bg-gray-500');
                    const propText = p.prop === 'house' ? UI_STRINGS[lang].house : (p.prop === 'inn' ? UI_STRINGS[lang].inn : UI_STRINGS[lang].all);

                    return `
                    <tr data-id="${p.id}" draggable="true" class="cursor-move">
                        <td class="py-3 px-2 font-medium">
                            <div class="flex justify-between items-center title-wrapper">
                                <div class="flex items-center gap-3 flex-grow">
                                    <button data-id="${p.id}" data-action="copy" class="btn-primary rounded-full w-8 h-8 flex items-center justify-center text-sm" title="${UI_STRINGS[currentLang].copyBtn}"><i class="far fa-copy"></i></button>
                                    <div class="expand-trigger cursor-pointer">
                                        <span>${p[`title${lang.toUpperCase()}`] || p.titleTH}</span>
                                        <span class="text-xs font-semibold rounded-full px-2 py-1 ml-2 md:hidden ${badgeClass}">${propText}</span>
                                    </div>
                                </div>
                                <i class="fas fa-chevron-down text-xs text-muted ml-2 expand-icon lg:hidden expand-trigger cursor-pointer"></i>
                            </div>
                            <div class="expandable-content lg:hidden">
                                <pre class="w-full text-xs p-2 mt-2 rounded bg-page whitespace-pre-wrap">${applyTone(p[`content${lang.toUpperCase()}`] || p.contentTH)}</pre>
                            </div>
                        </td>
                        <td class="py-3 px-2 hidden md:table-cell">
                             <span class="text-xs font-semibold rounded-full px-2 py-1 ${badgeClass}">
                                 <span class="w-2 h-2 rounded-full inline-block mr-1 ${dotClass}"></span>
                                 ${propText}
                             </span>
                        </td>
                        <td class="py-3 px-2 text-sm text-muted hidden lg:table-cell truncate max-w-xs">${applyTone(p[`content${lang.toUpperCase()}`] || p.contentTH)}</td>
                        <td class="py-3 px-2">
                            <div class="flex items-center justify-end gap-3">
                                <button data-id="${p.id}" data-action="edit" class="text-sm text-accent hover:text-accent-2" title="${UI_STRINGS[currentLang].editBtn}"><i class="fas fa-edit"></i></button>
                                <button data-id="${p.id}" data-action="delete" class="text-sm text-red-500 hover:text-red-700" title="${UI_STRINGS[currentLang].deleteBtn}"><i class="fas fa-trash"></i></button>
                            </div>
                        </td>
                        <td class="py-3 px-2 text-center text-muted cursor-grab"><i class="fas fa-grip-vertical"></i></td>
                    </tr>
                    `;
                }).join('') || `<tr><td colspan="5" class="py-8 text-center text-muted">${UI_STRINGS[lang].noData}</td></tr>`;
                
                addDragAndDropHandlers();
            }
            function fmtDDMMYY(d) {
                const dt = new Date(d);
                if(isNaN(dt) || !d) return '';
                const dd = ('0' + dt.getDate()).slice(-2);
                const mm = ('0' + (dt.getMonth() + 1)).slice(-2);
                const yy = (dt.getFullYear() + '').slice(-2);
                return `${dd}/${mm}/${yy}`;
            }
            function setToast(message, duration = 2000) { $toast.textContent = message; $toast.classList.add('show'); setTimeout(() => { $toast.classList.remove('show'); }, duration); }
            function copyText(txt){ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(txt).then(() => setToast(UI_STRINGS[currentLang].copySuccess)).catch(() => fallback(txt)); } else { fallback(txt); } function fallback(t){ const ta = document.createElement('textarea'); ta.value = t; ta.style.position = 'fixed'; ta.style.top = 0; ta.style.left = 0; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); setToast(UI_STRINGS[currentLang].copySuccess); } catch (err) { console.error('Fallback: Oops, unable to copy', err); setToast('Failed to copy'); } document.body.removeChild(ta); } }
            
            function showPresetModal(preset = null) {
                const isEditing = preset !== null;
                const modalTitle = $('#preset-modal-title');
                const saveButton = $('#preset-modal-save');
                
                modalTitle.textContent = isEditing ? UI_STRINGS[currentLang].editModalTitle : UI_STRINGS[currentLang].addModalTitle;
                saveButton.textContent = UI_STRINGS[currentLang].editModalSave;
                
                $('#preset-title-th').value = isEditing ? preset.titleTH : '';
                $('#preset-title-en').value = isEditing ? preset.titleEN || '' : '';
                $('#preset-prop').value = isEditing ? preset.prop : 'all';
                $('#preset-content-th').value = isEditing ? preset.contentTH : '';
                $('#preset-content-en').value = isEditing ? preset.contentEN || '' : '';

                editingPresetId = isEditing ? preset.id : null;

                $presetModal.classList.remove('hidden');
                $presetModal.classList.add('flex', 'opacity-100');
                $presetModal.querySelector('div').classList.remove('scale-95');
            }

            function hidePresetModal() {
                $presetModal.classList.remove('flex', 'opacity-100');
                $presetModal.classList.add('hidden');
                $presetModal.querySelector('div').classList.add('scale-95');
                editingPresetId = null;
            }
            
            function showConfirmModal(message, callback) {
                const lang = currentLang;
                $confirmModal.querySelector('h3').textContent = UI_STRINGS[lang].confirmTitle;
                $('#confirm-ok').textContent = UI_STRINGS[lang].confirmOk;
                $('#confirm-cancel').textContent = UI_STRINGS[lang].confirmCancel;
                $('#confirm-message').textContent = message;
                confirmCallback = callback;
                $confirmModal.classList.remove('hidden'); $confirmModal.classList.add('flex', 'opacity-100');
                $confirmModal.querySelector('div').classList.remove('scale-95');
            }
            function hideConfirmModal() { $confirmModal.classList.remove('flex', 'opacity-100'); $confirmModal.classList.add('hidden'); $confirmModal.querySelector('div').classList.add('scale-95'); confirmCallback = null; }

            function addDragAndDropHandlers() {
                const rows = $$('#presets-table-body tr[draggable="true"]');
                rows.forEach(row => {
                    row.addEventListener('dragstart', handleDragStart);
                    row.addEventListener('dragover', handleDragOver);
                    row.addEventListener('drop', handleDrop);
                    row.addEventListener('dragend', handleDragEnd);
                });
            }
            function handleDragStart(e) {
                draggedItem = this;
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/html', this.innerHTML);
                setTimeout(() => { this.classList.add('dragging'); }, 0);
            }
            function handleDragOver(e) {
                e.preventDefault();
                $$('#presets-table-body tr').forEach(row => row.classList.remove('drag-over'));
                if(this.draggable) {
                    this.classList.add('drag-over');
                }
            }
            function handleDrop(e) {
                e.stopPropagation(); 
                if (draggedItem !== this && this.draggable) {
                    const parent = draggedItem.parentNode;
                    const items = Array.from(parent.children);
                    const fromIndex = items.indexOf(draggedItem);
                    const toIndex = items.indexOf(this);
                    
                    if (fromIndex < toIndex) {
                        parent.insertBefore(draggedItem, this.nextSibling);
                    } else {
                        parent.insertBefore(draggedItem, this);
                    }
                }
                return false;
            }
            function handleDragEnd(e) {
                $$('#presets-table-body tr').forEach(row => row.classList.remove('dragging', 'drag-over'));
                updateOrderInFirebase();
            }

            function applyTone(text) {
                if (currentLang !== 'th' || !text) return text;
                if (currentTone === 'krub') {
                    return text.replace(/ค่ะ/g, 'ครับ').replace(/นะคะ/g, 'นะครับ');
                } else {
                    return text.replace(/ครับ/g, 'ค่ะ').replace(/นะครับ/g, 'นะคะ');
                }
            }

            // =================================================================
            // Event Listeners
            // =================================================================
            function setLang(lang) {
                currentLang = lang;
                $langTh.setAttribute('aria-pressed', lang === 'th');
                $langEn.setAttribute('aria-pressed', lang === 'en');
                localStorage.setItem('appLang', lang);

                $toneSeg.style.display = lang === 'th' ? 'inline-flex' : 'none';

                $('#generator-title').textContent = UI_STRINGS[lang].confirmGeneratorTitle;
                $('#generator-desc').textContent = UI_STRINGS[lang].confirmGeneratorDesc;
                $('#generator-copy-btn-text').textContent = UI_STRINGS[lang].copyBtn;
                $('#generator-checkin-label').textContent = UI_STRINGS[lang].checkinLabel;
                $('#generator-nights-label').textContent = UI_STRINGS[lang].nightsLabel;
                $('#generator-checkout-label').textContent = UI_STRINGS[lang].checkoutLabel;
                
                // Update new slip generator labels
                $('#slip-title').textContent = lang === 'th' ? 'ออกสลิปยืนยันการจอง (Final Slip)' : 'Generate Final Slip';
                $('#slip-desc').textContent = lang === 'th' ? 'กรอกข้อมูลลูกค้าและยอดเงินเพื่อสร้างข้อความแบบฟอร์ม' : 'Fill in customer details and amounts to generate the slip';
                $('#slip-prop-label').textContent = lang === 'th' ? 'ที่พัก' : 'Property';
                if ($('#slip-channel-label')) $('#slip-channel-label').textContent = lang === 'th' ? 'ช่องทางการจอง' : 'Booking Channel';
                $('#slip-name-label').textContent = lang === 'th' ? 'ชื่อผู้จอง' : 'Booker Name';
                $('#slip-phone-label').textContent = lang === 'th' ? 'เบอร์โทรติดต่อ' : 'Phone Number';
                $('#slip-deposit-label').textContent = lang === 'th' ? 'ยอดมัดจำ (บาท)' : 'Deposit (THB)';
                if ($('#slip-total-label')) $('#slip-total-label').textContent = lang === 'th' ? 'ยอดรวม (บาท)' : 'Total (THB)';
                $('#copy-slip-btn span').textContent = lang === 'th' ? 'คัดลอกสลิปยืนยัน' : 'Copy Final Slip';
                $('#slip-name').placeholder = lang === 'th' ? 'เช่น คุณสมชาย' : 'e.g. Somchai';
                $('#slip-phone').placeholder = lang === 'th' ? 'เช่น 0812345678' : 'e.g. 0812345678';

                renderTable();
                $('#confirmation-generator .ci-date').dispatchEvent(new Event('change'));
                document.dispatchEvent(new Event('langChanged')); // Trigger slip update
            }

            function setTone(tone) {
                currentTone = tone;
                $toneKa.setAttribute('aria-pressed', tone === 'ka');
                $toneKrub.setAttribute('aria-pressed', tone === 'krub');
                localStorage.setItem('appTone', tone);
                renderTable(); // Rerender table to apply new tone in previews
                $('#confirmation-generator .ci-date').dispatchEvent(new Event('change'));
            }
            
            $createNewBtn.addEventListener('click', () => showPresetModal());
            
            $('#preset-modal-cancel').addEventListener('click', hidePresetModal);

            $('#preset-modal-save').addEventListener('click', async () => {
                const titleTH = $('#preset-title-th').value.trim();
                if (!titleTH) {
                    alert('กรุณาใส่ชื่อข้อความ (TH)');
                    return;
                }

                const data = {
                    titleTH: titleTH,
                    titleEN: $('#preset-title-en').value.trim(),
                    prop: $('#preset-prop').value,
                    contentTH: $('#preset-content-th').value.trim(),
                    contentEN: $('#preset-content-en').value.trim(),
                };

                try {
                    if (editingPresetId) { // Editing
                        await updatePresetInFirebase(editingPresetId, data);
                        const index = allPresets.findIndex(p => p.id === editingPresetId);
                        if(index !== -1) {
                            allPresets[index] = { ...allPresets[index], ...data };
                        }
                         setToast("แก้ไขข้อความเรียบร้อยแล้ว", 2000);
                    } else { // Creating
                        const newId = `custom-${Date.now()}`;
                        const newPreset = {
                            ...data,
                            id: newId,
                            order: allPresets.length,
                        };
                        await addPresetToFirebase(newPreset);
                        allPresets.push(newPreset);
                         setToast(UI_STRINGS[currentLang].createSuccess, 2000);
                    }
                    
                    allPresets.sort((a, b) => a.order - b.order);
                    renderTable();
                    hidePresetModal();
                } catch (error) {
                    console.error("Error saving preset:", error);
                    alert("เกิดข้อผิดพลาดในการบันทึกข้อมูล");
                }
            });

             $('#auto-translate-btn').addEventListener('click', () => {
                const thContent = $('#preset-content-th').value;
                if (thContent.trim()) {
                    // This is a placeholder translation.
                    const enContent = `[Auto-translated from TH]:\n${thContent}`;
                    $('#preset-content-en').value = enContent;
                    setToast("แปลเป็นภาษาอังกฤษ (ตัวอย่าง)", 2000);
                } else {
                    setToast("กรุณาใส่เนื้อหาภาษาไทยก่อน", 2000);
                }
            });

            $searchInput.addEventListener('input', renderTable);
            $filterSelect.addEventListener('change', renderTable);
            
            $tableBody.addEventListener('click', (e) => {
                const button = e.target.closest('button[data-action]');
                if (button) {
                    const id = button.dataset.id;
                    const action = button.dataset.action;
                    const preset = allPresets.find(p => p.id === id);
                    if (!preset) return;

                    if (action === 'copy') { 
                        const originalText = preset[`content${currentLang.toUpperCase()}`] || preset.contentTH;
                        copyText(applyTone(originalText));
                    }
                    else if (action === 'edit') { showPresetModal(preset); }
                    else if (action === 'delete') { showConfirmModal(UI_STRINGS[currentLang].deleteConfirm, async () => { await deletePresetFromFirebase(id); allPresets = allPresets.filter(p => p.id !== id); renderTable(); }); }
                    return;
                }
                
                // For mobile row expansion
                const expandTrigger = e.target.closest('.expand-trigger');
                if (expandTrigger) {
                    const row = expandTrigger.closest('tr');
                    if (row) {
                        row.classList.toggle('is-expanded');
                    }
                }
            });

            $('#confirm-ok').addEventListener('click', () => { if (confirmCallback) { confirmCallback(); } hideConfirmModal(); });
            $('#confirm-cancel').addEventListener('click', hideConfirmModal);
            $themeToggle.addEventListener('click', () => { const isDark = $body.getAttribute('data-theme') === 'dark'; const nextTheme = isDark ? 'light' : 'dark'; $body.setAttribute('data-theme', nextTheme); $themeToggle.textContent = nextTheme === 'dark' ? '🌙' : '☀️'; localStorage.setItem('appTheme', nextTheme); });
            $langTh.addEventListener('click', () => setLang('th'));
            $langEn.addEventListener('click', () => setLang('en'));
            $toneKa.addEventListener('click', () => setTone('ka'));
            $toneKrub.addEventListener('click', () => setTone('krub'));
            
            // =================================================================
            // Initialization
            // =================================================================
            async function initialize() {
                const savedTheme = localStorage.getItem('appTheme') || 'light';
                const savedLang = localStorage.getItem('appLang') || 'th';
                const savedTone = localStorage.getItem('appTone') || 'krub';
                $body.setAttribute('data-theme', savedTheme);
                $themeToggle.textContent = savedTheme === 'dark' ? '🌙' : '☀️';

                allPresets = await loadPresetsFromFirebase();
                if (allPresets) {
                    allPresets.sort((a,b) => a.order - b.order);
                    initializeConfirmationGenerator();
                    initializeFinalSlipGenerator(); // เพิ่มการเรียกใช้ตรงนี้
                    setTone(savedTone);
                    setLang(savedLang); 
                } else {
                    console.error("Failed to load presets, allPresets is undefined.");
                    alert("ไม่สามารถโหลดข้อมูลได้ กรุณาลองรีเฟรชหน้าเว็บ");
                }
            }

            initialize();
        });
    </script>
</body>
</html>
